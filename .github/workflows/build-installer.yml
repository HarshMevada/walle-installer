# Builds the Chitu firmware in the cloud and publishes the web installer on GitHub Pages.
# Runs automatically on every change, or manually from the Actions tab
# (there you can pick another language).
name: Build Chitu web installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      language:
        description: "Language (en-US, hi-IN, ...)"
        default: "en-US"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # xiaozhi-esp32 version this Chitu board was written and tested against
  XIAOZHI_COMMIT: 1b7644a6fba2b025ed36b4ac6309f122cc3cea14

jobs:
  firmware:
    name: Firmware (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    strategy:
      fail-fast: false
      matrix:
        # One firmware per wake word. Words whose model is missing simply fail
        # here and are left out of the installer's wake word menu.
        include:
          - { model: wn9_hiesp,         label: "Hi ESP" }
          - { model: wn9_alexa,         label: "Alexa" }
          - { model: wn9_hiwalle_tts2,  label: "Hi Wall-E" }
          - { model: wn9_jarvis_tts,    label: "Jarvis" }
          - { model: wn9_hijason_tts2,  label: "Hi Jason" }
          - { model: wn9_sophia_tts,    label: "Sophia" }
          - { model: wn9_computer_tts,  label: "Computer" }
          - { model: wn9_hijoy_tts,     label: "Hi Joy" }
          - { model: wn9_hiandy_tts2,   label: "Hi Andy" }
          - { model: wn9_heywillow_tts, label: "Hey Willow" }
          - { model: wn9_mycroft_tts,   label: "Mycroft" }
          - { model: wn9_heykira_tts3,  label: "Hey Kira" }
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get xiaozhi and add the Chitu board
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/78/xiaozhi-esp32.git xiaozhi
          cd xiaozhi
          git checkout "$XIAOZHI_COMMIT"
          cp -r ../firmware/walle-xiao-s3 main/boards/
          git apply ../firmware/walle-board-registration.patch
          # self-signed certificate for the https phone console (needed for the phone mic)
          command -v openssl >/dev/null || (apt-get update -qq && apt-get install -y -qq openssl)
          python3 main/boards/walle-xiao-s3/tools/make_cert.py main/boards/walle-xiao-s3/chitu_cert.h

      - name: Build
        shell: bash
        working-directory: xiaozhi
        env:
          LANG_CODE: ${{ inputs.language || 'en-US' }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py walle-xiao-s3 --language "$LANG_CODE" --wake-word "${{ matrix.model }}"

      - name: Decode crash backtrace (debug/backtrace.txt)
        if: matrix.model == 'wn9_hiesp' && hashFiles('debug/backtrace.txt') != ''
        shell: bash
        working-directory: xiaozhi
        run: |
          source "$IDF_PATH/export.sh" > /dev/null
          echo "=== decoded backtrace ==="
          xtensa-esp32s3-elf-addr2line -pfiaC -e build/xiaozhi.elf $(cat ../debug/backtrace.txt)

      - name: Collect flash parts
        shell: bash
        working-directory: xiaozhi
        run: |
          # Separate parts (not one merged image) so re-installing keeps the saved Wi-Fi
          python3 - <<'PY'
          import json, os, shutil
          args = json.load(open("build/flasher_args.json"))
          out = "../out/${{ matrix.model }}"
          os.makedirs(out, exist_ok=True)
          parts = []
          for offset, path in sorted(args["flash_files"].items(), key=lambda kv: int(kv[0], 16)):
              name = os.path.basename(path)
              shutil.copy(os.path.join("build", path), os.path.join(out, name))
              parts.append({"path": name, "offset": int(offset, 16)})
          json.dump({"label": "${{ matrix.label }}", "model": "${{ matrix.model }}", "parts": parts},
                    open(os.path.join(out, "parts.json"), "w"))
          print(parts)
          PY

      - name: Save ELF (for decoding crashes)
        if: matrix.model == 'wn9_hiesp'
        uses: actions/upload-artifact@v7
        with:
          name: chitu-elf
          path: xiaozhi/build/xiaozhi.elf

      - name: Save firmware
        uses: actions/upload-artifact@v7
        with:
          name: chitu-fw-${{ matrix.model }}
          path: out
          if-no-files-found: error

  tests:
    name: Build hardware test sketches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and U8g2
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install U8g2

      - name: Compile tests
        shell: bash
        run: |
          set -e
          FQBN="esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default,PSRAM=opi"
          mkdir -p out
          for dir in tests/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries --output-dir "build/$name" "$dir"
            cp "build/$name/$name.ino.merged.bin" "out/$name.bin"
            echo "::endgroup::"
          done
          ls -la out

      - name: Save test binaries
        uses: actions/upload-artifact@v7
        with:
          name: chitu-tests
          path: out/*.bin
          if-no-files-found: error

  site:
    name: Prepare installer page
    needs: [firmware, tests]
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get firmware builds
        uses: actions/download-artifact@v8
        with:
          pattern: chitu-fw-*
          merge-multiple: true
          path: site/firmware

      - name: Get test binaries
        uses: actions/download-artifact@v8
        with:
          name: chitu-tests
          path: site/tests

      - name: Write manifests and wake word menu
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          VERSION="$VERSION" python3 - <<'PY'
          import json, os, glob
          version = os.environ["VERSION"]
          order = ["wn9_hiesp", "wn9_alexa", "wn9_hiwalle_tts2", "wn9_jarvis_tts", "wn9_hijason_tts2",
                   "wn9_sophia_tts", "wn9_computer_tts", "wn9_hijoy_tts", "wn9_hiandy_tts2",
                   "wn9_heywillow_tts", "wn9_mycroft_tts", "wn9_heykira_tts3"]
          words = []
          for f in glob.glob("site/firmware/*/parts.json"):
              info = json.load(open(f))
              model = info["model"]
              manifest = {
                  "name": "Chitu (" + info["label"] + ")",
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [{"chipFamily": "ESP32-S3", "improv": False,
                              "parts": [{"path": "firmware/%s/%s" % (model, p["path"]), "offset": p["offset"]}
                                        for p in info["parts"]]}],
              }
              json.dump(manifest, open("site/manifest-%s.json" % model, "w"), indent=2)
              words.append({"model": model, "label": info["label"]})
          words.sort(key=lambda w: order.index(w["model"]) if w["model"] in order else 99)
          if not words:
              raise SystemExit("no firmware was built")
          # default install button = first word (Hi ESP)
          os.system("cp site/manifest-%s.json site/manifest.json" % words[0]["model"])
          json.dump(words, open("site/wakewords.json", "w"))
          print("wake words:", [w["label"] for w in words])
          PY
          sed -i "s/__VERSION__/$VERSION/g" site/index.html
          for bin in site/tests/*.bin; do
            name=$(basename "$bin" .bin)
            printf '{"name":"Chitu %s","version":"%s","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"%s.bin","offset":0}]}]}\n' "$name" "$VERSION" "$name" > "site/tests/$name.json"
          done
          ls -la site site/firmware/*

      - name: Package page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
