# Builds the Wall-E firmware in the cloud and publishes the web installer on GitHub Pages.
# Runs automatically on every change, or manually from the Actions tab
# (there you can pick another language / wake word).
name: Build Wall-E web installer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      language:
        description: "Language (en-US, hi-IN, ...)"
        default: "en-US"
      wake_word:
        description: "Wake word: custom:<phrase> (e.g. custom:hello chitu) or a model (hiesp, ...)"
        default: "hiesp"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # xiaozhi-esp32 version this Wall-E board was written and tested against
  XIAOZHI_COMMIT: 1b7644a6fba2b025ed36b4ac6309f122cc3cea14

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get xiaozhi and add the Wall-E board
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/78/xiaozhi-esp32.git xiaozhi
          cd xiaozhi
          git checkout "$XIAOZHI_COMMIT"
          cp -r ../firmware/walle-xiao-s3 main/boards/
          git apply ../firmware/walle-board-registration.patch

      - name: Build
        shell: bash
        working-directory: xiaozhi
        env:
          LANG_CODE: ${{ inputs.language || 'en-US' }}
          WAKE_WORD: ${{ inputs.wake_word || 'hiesp' }}
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py walle-xiao-s3 --language "$LANG_CODE" --wake-word "$WAKE_WORD"

      - name: Decode crash backtrace (debug/backtrace.txt)
        if: hashFiles('debug/backtrace.txt') != ''
        shell: bash
        working-directory: xiaozhi
        run: |
          source "$IDF_PATH/export.sh" > /dev/null
          echo "=== decoded backtrace ==="
          xtensa-esp32s3-elf-addr2line -pfiaC -e build/xiaozhi.elf $(cat ../debug/backtrace.txt)

      - name: Save ELF (for decoding crashes)
        uses: actions/upload-artifact@v7
        with:
          name: walle-elf
          path: xiaozhi/build/xiaozhi.elf

      - name: Save firmware
        uses: actions/upload-artifact@v7
        with:
          name: walle-firmware
          path: xiaozhi/build/merged-binary.bin
          if-no-files-found: error

  tests:
    name: Build hardware test sketches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and U8g2
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install U8g2

      - name: Compile tests
        shell: bash
        run: |
          set -e
          FQBN="esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default,PSRAM=opi"
          mkdir -p out
          for dir in tests/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries --output-dir "build/$name" "$dir"
            cp "build/$name/$name.ino.merged.bin" "out/$name.bin"
            echo "::endgroup::"
          done
          ls -la out

      - name: Save test binaries
        uses: actions/upload-artifact@v7
        with:
          name: walle-tests
          path: out/*.bin
          if-no-files-found: error

  site:
    name: Prepare installer page
    needs: [firmware, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Get firmware
        uses: actions/download-artifact@v8
        with:
          name: walle-firmware
          path: site/firmware

      - name: Get test binaries
        uses: actions/download-artifact@v8
        with:
          name: walle-tests
          path: site/tests

      - name: Write manifest and version
        shell: bash
        run: |
          mv site/firmware/merged-binary.bin site/firmware/walle.bin
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          cat > site/manifest.json <<EOF
          {
            "name": "Wall-E Robot",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "improv": false,
                "parts": [{ "path": "firmware/walle.bin", "offset": 0 }]
              }
            ]
          }
          EOF
          sed -i "s/__VERSION__/$VERSION/g" site/index.html
          for bin in site/tests/*.bin; do
            name=$(basename "$bin" .bin)
            printf '{"name":"Wall-E %s","version":"%s","new_install_prompt_erase":false,"builds":[{"chipFamily":"ESP32-S3","parts":[{"path":"%s.bin","offset":0}]}]}\n' "$name" "$VERSION" "$name" > "site/tests/$name.json"
          done
          ls -la site/tests
          ls -la site site/firmware

      - name: Package page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
